# steamling-snapshots tunables — sourced by /usr/lib/steamling/snapshot-lib.sh
# (pacman backup= file: your edits survive package updates)

# pre-update snapshots to retain (pruned after each update + rollback)
STEAMLING_SNAPSHOT_KEEP=5

# below this much free space (MiB) the pre-update snapshot is SKIPPED — the
# update itself always proceeds
STEAMLING_SNAPSHOT_MIN_FREE_MIB=1024

# below this much free space (MiB) the Governor UI shows a warning
STEAMLING_SNAPSHOT_WARN_FREE_MIB=5120

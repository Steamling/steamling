# /usr/lib/steamling/boards/pocketdmg.conf: AYANEO Pocket DMG, on top of boards/family.conf.
# Untested port: expected to build and boot, but nobody has run Steamling on this handheld yet.
# Corrections from owners are very welcome.
. /usr/lib/steamling/boards/family.conf
STEAMLING_DEVICE=pocketdmg

# Panel: native 1080x1240@60 (the panel driver's mode).
STEAMLING_PANEL_W=1080
STEAMLING_PANEL_H=1240
STEAMLING_PANEL_REFRESH=60
STEAMLING_PANEL_ORIENT=left    # gamescope --force-orientation
STEAMLING_DESKTOP_ROTATE=left   # kscreen-doctor rotation token
STEAMLING_DESKTOP_SCALE=2.0
STEAMLING_GAMEPAD_QUIRK=ayaneo-xbox

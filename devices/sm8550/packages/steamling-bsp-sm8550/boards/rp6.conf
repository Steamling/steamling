# /usr/lib/steamling/boards/rp6.conf: Retroid Pocket 6, on top of boards/family.conf.
# These are also every consumer's built-in fallback values.
. /usr/lib/steamling/boards/family.conf
STEAMLING_DEVICE=rp6

# Panel: native 1080x1920@120 portrait, mounted rotation=270 -> landscape 1920x1080.
# W/H are the panel's NATIVE portrait mode; steamling-steam transposes them to logical landscape
# for left/right and rotation autodetects.
STEAMLING_PANEL_W=1080
STEAMLING_PANEL_H=1920
STEAMLING_PANEL_REFRESH=120
STEAMLING_PANEL_ORIENT=left        # gamescope --force-orientation
STEAMLING_PANEL_HDR_NITS=750       # HDR peak (gamescope --hdr-itm-target-nits); Visionox VTDR6130 profile in 10-steamling
STEAMLING_DESKTOP_ROTATE=left      # kscreen-doctor rotation token
STEAMLING_DESKTOP_SCALE=2.5

# /usr/lib/steamling/boards/pocketds.conf: AYANEO Pocket DS, on top of boards/family.conf.
# Untested port: expected to build and boot, but nobody has run Steamling on this handheld yet.
# Corrections from owners are very welcome.
. /usr/lib/steamling/boards/family.conf
STEAMLING_DEVICE=pocketds

# Panel: native 1080x1920@120 (the panel driver's mode).
STEAMLING_PANEL_W=1080
STEAMLING_PANEL_H=1920
STEAMLING_PANEL_REFRESH=120
STEAMLING_PANEL_ORIENT=left    # gamescope --force-orientation
STEAMLING_DESKTOP_ROTATE=left   # kscreen-doctor rotation token
STEAMLING_DESKTOP_SCALE=2.5
STEAMLING_PANEL_OUTPUT=DSI-1      # the top panel; the bottom one is DSI-2
STEAMLING_PANEL_HDR_NITS=780
STEAMLING_GAMEPAD_QUIRK=ayaneo-default

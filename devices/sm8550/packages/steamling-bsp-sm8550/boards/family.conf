# /usr/lib/steamling/boards/family.conf: facts every SM8550 board shares, sourced first by
# each board file (a board may override).
STEAMLING_SOC=sm8550

# Fake on every board: gamepadui sets its dpi from it as W * 25.4 / 177.
STEAMLING_PANEL_MM=177x100

# Cores games and emulators are pinned to (read through steamling-bsp-common's cores.sh):
# cpu0-2 are the A510 littles, cpu3-7 the A710/A715 mids + X3 prime.
STEAMLING_BIG_CORES=3-7

# --- install-to-internal contract (qcom-abl) -----------------------------------
STEAMLING_INTERNAL_DISK=/dev/sda
STEAMLING_BOOT_GPT_NAME=STEAMLING

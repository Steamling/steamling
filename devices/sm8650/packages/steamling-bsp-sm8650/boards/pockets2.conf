# /usr/lib/steamling/boards/pockets2.conf: AYANEO Pocket S2, on top of boards/family.conf.
# Untested port: expected to build and boot, but nobody has run Steamling on this handheld yet.
# Corrections from owners are very welcome.
. /usr/lib/steamling/boards/family.conf
STEAMLING_DEVICE=pockets2

# Panel: native 1440x2560@60 (the panel driver's mode).
STEAMLING_PANEL_W=1440
STEAMLING_PANEL_H=2560
STEAMLING_PANEL_REFRESH=60
STEAMLING_PANEL_ORIENT=right   # gamescope --force-orientation
STEAMLING_DESKTOP_ROTATE=right  # kscreen-doctor rotation token
STEAMLING_DESKTOP_SCALE=3.0
STEAMLING_PANEL_ROTATE_SHADER=1   # 1440 lines: past the DPU rotator's 1088-line cap
STEAMLING_GAMEPAD_QUIRK=ayaneo-default

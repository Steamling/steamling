# POSIX sh, sourced by scripts/lib.sh after config/steamling.conf; the environment overrides it.
# Untested port: expected to build and boot, but nobody has run Steamling on this family yet.
# Corrections from owners are very welcome.

DEVICE_PRETTY="SM8650 family (Snapdragon 8 Gen 3)"
: "${SOC:=sm8650}"

# qcom-abl: GPT p1 FAT (KERNEL + KERNEL.md5), p2 root, booted by the ROCKNIX ABL as on SM8550.
: "${BOOTLOADER:=qcom-abl}"

# No initramfs: UFS/SCSI and the root fs are built in (kernel/steamling/config-assert).
: "${KERNEL_CMDLINE_ROOT:=root=PARTLABEL=${ROOT_LABEL} rw}"
: "${KERNEL_CMDLINE_EXTRA:=quiet loglevel=3 systemd.show_status=false splash logo.nologo plymouth.ignore-serial-consoles rootwait console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat cgroup.memory=nokmem,nosocket nosoftlockup swiotlb=8192 mem_sleep_default=s2idle}"

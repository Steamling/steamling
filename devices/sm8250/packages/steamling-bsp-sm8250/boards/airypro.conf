# /usr/lib/steamling/boards/airypro.conf: MANGMI Air Y Pro, on top of boards/family.conf.
# Untested port: expected to build and boot, but nobody has run Steamling on this handheld yet.
# Corrections from owners are very welcome.
. /usr/lib/steamling/boards/family.conf
STEAMLING_DEVICE=airypro

# Panel: native 1280x960@60 (the panel driver's mode).
STEAMLING_PANEL_W=1280
STEAMLING_PANEL_H=960
STEAMLING_PANEL_REFRESH=60
STEAMLING_PANEL_ORIENT=normal  # gamescope --force-orientation
STEAMLING_DESKTOP_ROTATE=none   # kscreen-doctor rotation token
STEAMLING_DESKTOP_SCALE=2.0
STEAMLING_PANEL_MM=120x90

# steamos-manager's device match for this family, by devicetree compatible (these boards have
# no DMI). Entries match in order, so the SoC entry stays last to catch boards without their
# own line: an unmatched board would get a local CpuScaling1.

[[device]]
dt.compatible = "ayn,odin3"
device        = "ayn_odin_3"
variant       = "Odin3"
friendly_name = "AYN Odin 3"

[[device]]
dt.compatible = "konkr,pocket-fit-elite"
device        = "konkr_pocket_fit_elite"
variant       = "PocketFITElite"
friendly_name = "KONKR Pocket FIT Elite"

[[device]]
dt.compatible = "qcom,sm8750"
device        = "steamling_sm8750"
variant       = "SM8750"
friendly_name = "Snapdragon 8 Elite handheld"

# Leaves the slot for steamling-perfd, which only allows schedutil.
[cpu_scaling]
driver = "none"

# qcom_battmgr raises end thresholds below 55 to 55.
[battery_charge_limit]
suggested_minimum_limit = 55
method = "power_supply"

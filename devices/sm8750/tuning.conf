# Userspace compiler tuning for this chip. POSIX sh, sourced by scripts/lib.sh
# after the profile; build-packages.sh passes the values into makepkg's
# environment for the packages/soc PKGBUILDs (never packages/shared).
#
# The Snapdragon 8 Elite's Oryon cores: armv8.6 with the crypto, int8 and bf16 extensions is a
# safe subset, tuned generically until a toolchain with an Oryon tune is in the base.
: "${STEAMLING_TUNE_CFLAGS:=-march=armv8.6-a+crypto+sha3+sm4+i8mm+bf16+fp16 -mtune=generic -mno-outline-atomics}"
# FEX engine tuning: the JIT output is runtime-tuned to the real CPU regardless.
: "${STEAMLING_FEX_TUNE_CPU:=cortex-a78}"

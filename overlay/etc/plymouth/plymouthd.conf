# steamling — plymouth boot splash config.
# steamling = the Steamling logo (no wordmark), its protons and electrons orbiting in place of the spinner,
# shipped by steamling-branding in its OWN theme dir so a plymouth upgrade can't undo it.
# ShowDelay=0: with no initramfs the splash already starts "late"
# (sysinit, ~2.5s); don't add the default 5s hide-short-boots delay on top or it would never show.
# DeviceTimeout caps how long plymouthd waits for the DRM device before falling back, so a display
# problem can't wedge boot.
[Daemon]
Theme=steamling
ShowDelay=0
DeviceTimeout=8
DeviceScale=2
